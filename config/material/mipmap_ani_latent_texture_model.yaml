type: "MipmapAniLatentTexturedModel"
latent_dim: 16
predict_frame: True
use_nerfstudio_sh: False

gt_frame: False
colorful_texture: True
leaky_relu: True
texture_resolution: 2048
hidden_layers: [128, 128, 64, 32, 16]
# hidden_layers: [256, 256, 128, 64, 32, 16]
Gaussian_blur: True
activation: "relu"
input_channels: 9

# mipmap texture
mipmap_levels: 4
base_footprint: 1e-7 

# neural geometry 
neural_geometry:
  enable: True
  latent_dim: 8
  hidden_layers: [16, 8, 4]
  output_channels: 2 # 2D uv offset
  local_wi_wo: False # Use local or global wi-wo
  positional_encoding: False # Use position encoding or not
  recompute_frame: False

# config 1:
# larger_latent_dim: True
# different_decoder: True
# output_channels: 1

# # config 2:
# larger_latent_dim: True
# different_decoder: False
# output_channels: 1

# # config 3:
larger_latent_dim: False
different_decoder: False
output_channels: 3
 