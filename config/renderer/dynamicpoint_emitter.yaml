type: "path_tracing_multipoint_emitter"
brdf_sampling: True # not actually used
emitter_sampling: False # not actually used
indir_depth: 0

camera:
  distance: 2.0
  number_of_views: 512 # used during training
  number_of_view_test: 128
  views_per_batch: 8
  theta_angle: 80.0 # used during validation and testing
  look_at: [0.0, 0.0, 0.0]
  up: [0.0, 1.0, 0.0]
  position: [0.0, 0.0, -2.0]
  camera_angle_x: 0.5
  spiral_path: False

emitter:
  type: "presetpoint"
  dist: 4.0
  num_lights: 1
  theta_angle: 80.0 # used during validation and testing
  different_per_point: True # if True, use one random emitter for each ray
  rotate_with_camera: True # if True, it's like rotating the object during validation

spp:
  train: 1
  val: 1
  test: 1
SPP_chunk: 4

resolution: [2048, 2048]
