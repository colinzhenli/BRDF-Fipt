type: "path_tracing_envmap_emitter"
brdf_sampling: True
emitter_sampling: True
indir_depth: 0

camera:
  distance: 2.0
  number_of_views: 32
  look_at: [0.0, 0.0, 0.0]
  up: [0.0, 1.0, 0.0]
  camera_angle_x: 0.5

emitter:
  type: "envmap"
  envmap_path: "./envmap.exr"

spp:
  train: 2048
  val: 2048
  test: 2048
SPP_chunk: 16

resolution: [1024, 1024]
