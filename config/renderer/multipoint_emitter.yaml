type: "path_tracing_multipoint_emitter"
brdf_sampling: True # not actually used
emitter_sampling: False # not actually used
indir_depth: 0

camera:
  distance: 2.0
  number_of_views: 1
  look_at: [0.0, 0.0, 0.0]
