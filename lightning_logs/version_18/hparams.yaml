data:
  num_workers: 8
  batch_num: 1024
  batch_size: 8192
  dataset_name: sphere
  dataset_path: None
  shape:
    type: sphere
    center:
    - 0.0
    - 0.0
    - 0.0
    radius: 0.2
  pixel: true
  ray_diff: true
  custom_c2w: true
renderer:
  type: path_tracing_multipoint_emitter
  brdf_sampling: true
  emitter_sampling: false
  indir_depth: 0
  camera:
    distance: 2.0
    number_of_views: 32
    look_at:
    - 0.0
    - 0.0
    - 0.0
    up:
    - 0.0
    - 1.0
    - 0.0
    position:
    - 0.0
    - 0.0
    - -2.0
    camera_angle_x: 0.5
    spiral_path: false
  emitter:
    type: dynamicpoint
    dist: 4.0
    num_lights: 4
  spp:
    train: 1
    val: 1
    test: 1
  SPP_chunk: 4
  resolution:
  - 1024
  - 1024
material:
  type: MLPPBRBRDF
  hidden_layers:
  - 48
  - 48
  - 24
  - 12
  - 6
  activation: relu
  input_channels: 9
  output_channels: 1
model:
  ckpt_path: /localhome/zla247/theia2_data/output/BRDF-Fipt/Over-fit_experiments_2/sphere/Dynamic-point-emitter-run_1/training/model_0.20_0.20/last.ckpt
  logger:
