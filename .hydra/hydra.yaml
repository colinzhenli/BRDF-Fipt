hydra:
  run:
    dir: /home/zla247/projects/BRDF-Fipt
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir="/home/zla247/projects/BRDF-Fipt"
    - hydra.job.name=train_ddp_process_1
    - hydra.mode=RUN
    task:
    - dataset_folder=/media/raid/cloth/Bonn_train
    - data=bonn
    - data.use_pan=True
    - data.use_lls=True
    - data.debug=False
    - data.debug_num=10
    - data.rays_num=131072
    - data.num_load_workers=16
    - renderer=multiarea_emitter
    - material=bonn_latent
    - experiment_name=Stage-1_Bonn_DDP2_debug_run_1
    - model.optimizer.reset_latent_momentum_on_chunk_switch=False
    - model.optimizer.name=Adam8bit
    - model.loss.recon_loss.name=logrel
    - model.loss.recon_loss.log_space.logrel_ref=0.05
    - model.loss.reg_loss.weight=0.0
    - model.loss.pan_weight=0.5
    - model.loss.lls_weight=0.5
    - model.lls_spp=4
    - model.stage=1
    - model.test=False
    - model.continue_training=False
    - model.trainer.max_epochs=3000
    - model.trainer.devices=2
    - model.trainer.strategy=ddp_find_unused_parameters_true
    - model.optimizer.decoder_lr=1e-4
    - model.trainer.limit_train_batches=512
    - model.trainer.check_val_every_n_epoch=20
    - material.decoder.use_skip_connection=True
    - material.decoder.use_film=False
    - material.decoder.use_color_decomp=False
    - material.latent_dim=24
    - material.decoder.degree=3
    - material.decoder.smooth_reg=False
    - material.different_decoder=False
    - data.filter_observations=False
  job:
    name: train_ddp_process_1
    chdir: null
    override_dirname: data.debug=False,data.debug_num=10,data.filter_observations=False,data.num_load_workers=16,data.rays_num=131072,data.use_lls=True,data.use_pan=True,data=bonn,dataset_folder=/media/raid/cloth/Bonn_train,experiment_name=Stage-1_Bonn_DDP2_debug_run_1,material.decoder.degree=3,material.decoder.smooth_reg=False,material.decoder.use_color_decomp=False,material.decoder.use_film=False,material.decoder.use_skip_connection=True,material.different_decoder=False,material.latent_dim=24,material=bonn_latent,model.continue_training=False,model.lls_spp=4,model.loss.lls_weight=0.5,model.loss.pan_weight=0.5,model.loss.recon_loss.log_space.logrel_ref=0.05,model.loss.recon_loss.name=logrel,model.loss.reg_loss.weight=0.0,model.optimizer.decoder_lr=1e-4,model.optimizer.name=Adam8bit,model.optimizer.reset_latent_momentum_on_chunk_switch=False,model.stage=1,model.test=False,model.trainer.check_val_every_n_epoch=20,model.trainer.devices=2,model.trainer.limit_train_batches=512,model.trainer.max_epochs=3000,model.trainer.strategy=ddp_find_unused_parameters_true,renderer=multiarea_emitter
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/zla247/projects/BRDF-Fipt
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/zla247/projects/BRDF-Fipt/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/zla247/projects/BRDF-Fipt
    choices:
      material: bonn_latent
      model: direct
      renderer: multiarea_emitter
      data: bonn
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
